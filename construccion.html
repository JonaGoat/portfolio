
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#19070e">
  <title>En construcción | Jonathan Morales</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="construction-page">

  <main class="construction-screen">

    <div class="construction-screen-content">

      <div class="construction-screen-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="54" height="54"
             fill="none" stroke="currentColor"
             stroke-width="1.4" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M12 2l1.5 2.5 2.9.6 2.4-1.2 2.1 2.1-1.2 2.4.6 2.9L23 12l-2.7 1.5-.6 2.9 1.2 2.4-2.1 2.1-2.4-1.2-2.9.6L12 23l-1.5-2.7-2.9-.6-2.4 1.2-2.1-2.1 1.2-2.4-.6-2.9L1 12l2.7-1.5.6-2.9-1.2-2.4 2.1-2.1 2.4 1.2 2.9-.6L12 2Z"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>
      </div>

      <span class="construction-screen-label">
        LABORATORIO / SISTEMA EN DESARROLLO
      </span>

      <h1>
        Algo <br>
        <span>se está construyendo.</span>
      </h1>

      <p>
        Las ideas necesitan su tiempo.<br>
        Esta parte del laboratorio estará lista próximamente.
      </p>

      <div class="construction-screen-status">
        <span class="status-dot"></span>
        ASSEMBLY IN PROGRESS...
      </div>

      <a href="index.html" class="btn btn-primary">
        ← Volver al laboratorio
      </a>

    </div>

  </main>

</body>
</html>
